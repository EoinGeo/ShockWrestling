        <style>

            :root {

            * {

            body {
                margin: 0;

            }
            .layout {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
            }
            .bracket-row {
                display: flex;
                gap: 2rem;
                justify-content: center;

                padding-bottom: 2rem;
                width: 100%;
            }
            .col {
                display: flex;
                flex-direction: column;
                min-width: 200px;
            }
            .col.finals {
                min-width: 240px;

            .col-title {
                font-weight: 700;

                color: #e7c319;

            }
            .col-title.right-title {
            }

                flex-direction: column;
                justify-content: space-around;

            }
            .match {
                display: flex;
                flex-direction: column;

            .slot {
                width: 100%;
                min-width: 180px;
                padding: 0.8rem 1rem;
                border-radius: 0.6rem;
                border: 2px solid var(--border);
                background: #292737;
                color: #e7c319;
                text-align: left;
                cursor: pointer;
                transition: 0.15s;
                font-size: 1rem;
                display: block;
            }
            .slot:hover {
                border-color: var(--blue);
                background: #eff6ff;
            }
            .slot.selected {
                background: var(--blue);
                color: #292737;
                border-color: var(--blue2);
                font-weight: 700;
            }
            .slot:disabled,
            .slot.disabled {
                background: var(--graybg);
                border-color: #e5e7eb;
                color: var(--graytext);
                cursor: not-allowed;
                opacity: 0.65;
            }
            .slot.empty {
                cursor: not-allowed;
                text-align: center;
                color: var(--graytext);
                background: var(--graybg);
                border-style: dashed;
                opacity: 0.65;
            }
            .wrap {
                display: flex;
                gap: 1.5rem;

                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }
            .side-panel {
                width: 360px;

                background: #292737;
                border: 1px solid #e7c319;

                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
                backdrop-filter: blur(8px);
            }
            .panel-title {
                font-size: 1.35rem;

            .field {

            label {
                display: block;

                margin-bottom: 0.4rem;
            }
            input[type="text"] {
                width: 100%;
                padding: 0.8rem 0.9rem;
                border: 1px solid var(--border);
                border-radius: 0.6rem;

                outline: none;
            }
            input[type="text"]:focus {
                border-color: var(--blue);
            }
            .summary {

            }
            .summary h3 {
                color: #e7c319;
                margin: 0 0 0.75rem;
            }
            .summary-grid {
                display: grid;
                gap: 0.5rem;

            .summary-row {
                display: flex;
                justify-content: space-between;
                gap: 1rem;

            .actions {
                display: flex;

            .primary,

                flex: 1;
                border: 0;
                padding: 0.85rem 1rem;
                border-radius: 0.6rem;
                font-weight: 700;
                cursor: pointer;
            }
            .primary {
                background: var(--blue);
                color: #fff;
            }
            .primary:disabled {
                background: #93c5fd;
                cursor: not-allowed;
            }
            .secondary {
                background: #e5e7eb;

            #messageBox {

            #messageBox.success {

    <body>
        <div class="min-h-screen p-8">
            <div class="max-w">
                <div id="bracketView">
                    <div class="wrap">
                        <div class="layout" style="flex: 1">
                            <div class="bracket-row">
                                <div class="col">
                                    <h2 class="col-title">Round of 16</h2>
                                    <div class="round-inner" id="left-r16"></div>
                                </div>
                                <div class="col">
                                    <h2 class="col-title">Quarterfinals</h2>
                                    <div class="round-inner" id="left-qf"></div>
                                </div>
                                <div class="col">
                                    <h2 class="col-title">Semifinals</h2>
                                    <div class="round-inner" id="left-sf"></div>
                                </div>
                                <div class="col finals">
                                    <h2 class="col-title">Finals</h2>
                                    <div class="round-inner" id="final-round"></div>
                                </div>
                                <div class="col">
                                    <h2 class="col-title right-title">Semifinals</h2>
                                    <div class="round-inner" id="right-sf"></div>
                                </div>
                                <div class="col">
                                    <h2 class="col-title right-title">Quarterfinals</h2>
                                    <div class="round-inner" id="right-qf"></div>
                                </div>
                                <div class="col">
                                    <h2 class="col-title right-title">Round of 16</h2>
                                    <div class="round-inner" id="right-r16"></div>
                                </div>
                            </div>
                        </div>
                        <aside class="side-panel">
                            <h2 class="panel-title">Submit picks</h2>
                            <div class="field">
                                <label for="nameInput" class="nameInputLabel">Your name</label
                                ><input id="nameInput" type="text" placeholder="Enter your name" maxlength="80" />
                            </div>
                            <div class="summary">
                                <h3>Current bracket</h3>
                                <div class="summary-grid" id="summaryGrid"></div>
                            </div>
                            <div class="actions">
                                <button class="primary" id="submitBtn">Submit</button
                                ><button class="secondary" id="resetBtn">Reset picks</button>
                            </div>
                        </aside>
                    </div>
                </div>

                <div id="successView" class="hidden">
                    <div class="view-card">
                        <div class="success-top">✓</div>
                        <h2 class="panel-title" style="text-align: center">Your picks</h2>
                        <p class="help" style="text-align: center">Your bracket has been submitted successfully.</p>
                        <div class="summary" style="margin-top: 1.25rem">
                            <div class="summary-grid" id="finalSummary"></div>
                        </div>
                    </div>
                </div>
            </div>

        <script>
            window.addEventListener("load", () => {
                window.parent.postMessage({type: "HTML_READY"}, "*");
                reorderBracket();
            });

            const TABLET_BREAKPOINT = 980;

            function reorderBracket() {
                const row = document.querySelector(".bracket-row");
                if (!row) return;

                const isTablet = window.innerWidth < TABLET_BREAKPOINT;

                const leftR16 = document.getElementById("left-r16")?.closest(".col");
                const rightR16 = document.getElementById("right-r16")?.closest(".col");
                const leftQf = document.getElementById("left-qf")?.closest(".col");
                const rightQf = document.getElementById("right-qf")?.closest(".col");
                const leftSf = document.getElementById("left-sf")?.closest(".col");
                const rightSf = document.getElementById("right-sf")?.closest(".col");
                const finals = document.getElementById("final-round")?.closest(".col");

                if (!leftR16 || !rightR16 || !leftQf || !rightQf || !leftSf || !rightSf || !finals) return;

                row.innerHTML = "";

                if (isTablet) {
                    [leftR16, rightR16, leftQf, rightQf, leftSf, rightSf, finals].forEach((el) => row.appendChild(el));
                } else {
                    [leftR16, leftQf, leftSf, finals, rightSf, rightQf, rightR16].forEach((el) => row.appendChild(el));
                }
            }
            const rounds = {
                leftR16: [
                    {id: "r_16_1", options: ["[FIN] Jindrak", "[USA] Russell"]},
                    {id: "r_16_2", options: ["[DOM] Big Papi L", "[KEN] Nyatikali"]},
                    {id: "r_16_3", options: ["[PHI] Ryan Rizal", "[N/A] Emerson Rivers"]},
                    {id: "r_16_4", options: ['[KOR] "Filthy" Flame Shadow', "[SUI] Vittorio Grau"]},
                ],
                rightR16: [
                    {id: "r_16_5", options: ["[JPN] Aku Suzuki", "[AUS] Paz"]},
                    {id: "r_16_6", options: ["[WAL] Chopper", "[LBA] Tyler Frost"]},
                    {id: "r_16_7", options: ["[MEX] Rodkip", "[VIE] Luc"]},
                    {id: "r_16_8", options: ["[ENG] Harry Hale", "[IRE] Eoin"]},
                ],
            };

            const picks = {
                r_16_1: "",
                r_16_2: "",
                r_16_3: "",
                r_16_4: "",
                r_16_5: "",
                r_16_6: "",
                r_16_7: "",
                r_16_8: "",
                qf1: "",
                qf2: "",
                qf3: "",
                qf4: "",
                sf1: "",
                sf2: "",
                final: "",
            };

            const order = [
                "r_16_1",
                "r_16_2",
                "r_16_3",
                "r_16_4",
                "r_16_5",
                "r_16_6",
                "r_16_7",
                "r_16_8",
                "qf1",
                "qf2",
                "qf3",
                "qf4",
                "sf1",
                "sf2",
                "final",
            ];

            function roundComplete(keys) {
                return keys.every((k) => picks[k]);
            }

            function qfOptions(i) {
                if (i === 1) return [picks.r_16_1, picks.r_16_2].filter(Boolean);
                if (i === 2) return [picks.r_16_3, picks.r_16_4].filter(Boolean);
                if (i === 3) return [picks.r_16_5, picks.r_16_6].filter(Boolean);
                if (i === 4) return [picks.r_16_7, picks.r_16_8].filter(Boolean);
                return [];
            }

            function sfOptions(i) {
                if (i === 1) return [picks.qf1, picks.qf2].filter(Boolean);
                if (i === 2) return [picks.qf3, picks.qf4].filter(Boolean);
                return [];
            }

            function finalOptions() {
                return [picks.sf1, picks.sf2].filter(Boolean);
            }

            function allR16Complete() {
                return roundComplete(["r_16_1", "r_16_2", "r_16_3", "r_16_4", "r_16_5", "r_16_6", "r_16_7", "r_16_8"]);
            }

            function allQFComplete() {
                return roundComplete(["qf1", "qf2", "qf3", "qf4"]);
            }

            function allSFComplete() {
                return roundComplete(["sf1", "sf2"]);
            }

            function ensureDependencies() {
                if (!qfOptions(1).includes(picks.qf1)) picks.qf1 = "";
                if (!qfOptions(2).includes(picks.qf2)) picks.qf2 = "";
                if (!qfOptions(3).includes(picks.qf3)) picks.qf3 = "";
                if (!qfOptions(4).includes(picks.qf4)) picks.qf4 = "";
                if (!sfOptions(1).includes(picks.sf1)) picks.sf1 = "";
                if (!sfOptions(2).includes(picks.sf2)) picks.sf2 = "";
                if (!finalOptions().includes(picks.final)) picks.final = "";
            }

            function matchTemplate(id, options, selected, locked) {
                const wrap = document.createElement("div");
                wrap.className = "match";
                if (locked) {
                    const empty = document.createElement("div");
                    empty.className = "slot empty";
                    empty.textContent = "Locked until previous round is complete";
                    wrap.appendChild(empty);
                    return wrap;
                }
                if (!options.length) {
                    const empty = document.createElement("div");
                    empty.className = "slot empty";
                    empty.textContent = "Waiting for previous round";
                    wrap.appendChild(empty);
                    return wrap;
                }
                options.forEach((option) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className =
                        "slot" + (selected === option ? " selected" : "") + " " + (locked ? "disabled" : "");
                    btn.disabled = locked;
                    btn.textContent = option;
                    btn.addEventListener("click", () => {
                        if (locked) return;
                        picks[id] = option;
                        ensureDependencies();
                        render();
                    });
                    wrap.appendChild(btn);
                });
                return wrap;
            }

            function renderR16(containerId, matches) {
                const root = document.getElementById(containerId);
                if (!root) return;
                root.innerHTML = "";
                matches.forEach((match) =>
                    root.appendChild(matchTemplate(match.id, match.options, picks[match.id], false))
                );
            }

            function buildPayload() {
                return {
                    name: document.getElementById("nameInput").value.trim(),
                    ...picks,
                };
            }

            function showDebugPayload() {
                const box = document.getElementById("debugBox");
                if (box) box.textContent = JSON.stringify(buildPayload(), null, 2);
            }

            function updateSummary() {
                const summary = document.getElementById("summaryGrid");
                if (!summary) return;
                summary.innerHTML = "";
                [
                    ["Quarter Final 1", picks.qf1],
                    ["Quarter Final 2", picks.qf2],
                    ["Quarter Final 3", picks.qf3],
                    ["Quarter Final 4", picks.qf4],
                    ["Semi Final 1", picks.sf1],
                    ["Semi Final 2", picks.sf2],
                    ["Champion", picks.final],
                ].forEach(([label, value]) => {
                    const row = document.createElement("div");
                    row.className = "summary-row";
                    row.innerHTML = `<span>${label}</span><strong>${value || "—"}</strong>`;
                    summary.appendChild(row);
                });
            }

            function render() {
                reorderBracket();
                const r16Done = allR16Complete();
                const qfDone = allQFComplete();
                const sfDone = allSFComplete();
                renderR16("left-r16", rounds.leftR16);
                renderR16("right-r16", rounds.rightR16);
                const leftQf = document.getElementById("left-qf");
                if (leftQf) {
                    leftQf.innerHTML = "";
                    leftQf.appendChild(matchTemplate("qf1", qfOptions(1), picks.qf1, !r16Done));
                    leftQf.appendChild(matchTemplate("qf2", qfOptions(2), picks.qf2, !r16Done));
                }
                const rightQf = document.getElementById("right-qf");
                if (rightQf) {
                    rightQf.innerHTML = "";
                    rightQf.appendChild(matchTemplate("qf3", qfOptions(3), picks.qf3, !r16Done));
                    rightQf.appendChild(matchTemplate("qf4", qfOptions(4), picks.qf4, !r16Done));
                }
                const leftSf = document.getElementById("left-sf");
                if (leftSf) {
                    leftSf.innerHTML = "";
                    leftSf.appendChild(matchTemplate("sf1", sfOptions(1), picks.sf1, !qfDone));
                }
                const rightSf = document.getElementById("right-sf");
                if (rightSf) {
                    rightSf.innerHTML = "";
                    rightSf.appendChild(matchTemplate("sf2", sfOptions(2), picks.sf2, !qfDone));
                }
                const finalRound = document.getElementById("final-round");
                if (finalRound) {
                    finalRound.innerHTML = "";
                    finalRound.appendChild(matchTemplate("final", finalOptions(), picks.final, !sfDone));
                }
                const complete = order.filter((k) => picks[k]).length;
                const statusPill = document.getElementById("statusPill");
                if (statusPill) statusPill.textContent = `${complete} / 15 picks complete`;
                updateSummary();
                const nameOk = document.getElementById("nameInput").value.trim().length > 0;
                const completeAndName = complete === 15 && nameOk;
                const submitBtn = document.getElementById("submitBtn");
                if (submitBtn) {
                    submitBtn.disabled = !completeAndName;
                    submitBtn.style.pointerEvents = completeAndName ? "auto" : "none";
                }
                const lockedHint = document.getElementById("lockedHint");
                if (lockedHint) {
                    lockedHint.textContent = !r16Done
                        ? "Quarterfinals locked until all Round of 16 picks are complete."
                        : !qfDone
                        ? "Semifinals locked until all Quarterfinal picks are complete."
                        : !sfDone
                        ? "Final is locked until all Semifinal picks are complete."
                        : "All rounds unlocked. You can submit now.";
                }
                const box = document.getElementById("messageBox");
                if (box) {
                    box.className = "";
                    box.style.display = "none";
                }
                showDebugPayload();
            }

            function showMessage(type, text) {
                const box = document.getElementById("messageBox");
                if (!box) return;
                box.className = `message ${type}`;
                box.textContent = text;
            }

            function showSuccessView() {
                const bracketView = document.getElementById("bracketView");
                const successView = document.getElementById("successView");
                const finalSummary = document.getElementById("finalSummary");
                if (bracketView) bracketView.classList.add("hidden");
                if (successView) successView.classList.remove("hidden");
                if (finalSummary) {
                    const p = buildPayload();
                    finalSummary.innerHTML = "";
                    [
                        ["Name", p.name || "—"],
                        ["Champion", p.final || "—"],
                        ["Quarter Final 1", p.qf1 || "—"],
                        ["Quarter Final 2", p.qf2 || "—"],
                        ["Quarter Final 3", p.qf3 || "—"],
                        ["Quarter Final 4", p.qf4 || "—"],
                        ["Semi Final 1", p.sf1 || "—"],
                        ["Semi Final 2", p.sf2 || "—"],
                    ].forEach(([label, value]) => {
                        const row = document.createElement("div");
                        row.className = "summary-row";
                        row.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
                        finalSummary.appendChild(row);
                    });
                }
            }

            function showBracketView() {
                const bracketView = document.getElementById("bracketView");
                const successView = document.getElementById("successView");
                if (bracketView) bracketView.classList.remove("hidden");
                if (successView) successView.classList.add("hidden");
            }

            const nameInputEl = document.getElementById("nameInput");
            if (nameInputEl) nameInputEl.addEventListener("input", render);

            const resetBtnEl = document.getElementById("resetBtn");
            if (resetBtnEl) {
                resetBtnEl.addEventListener("click", () => {
                    Object.keys(picks).forEach((key) => (picks[key] = ""));
                    const nameInput = document.getElementById("nameInput");
                    if (nameInput) nameInput.value = "";
                    showBracketView();
                    showMessage("success", "Bracket reset.");
                    render();
                });
            }

            const submitBtnEl = document.getElementById("submitBtn");
            if (submitBtnEl) {
                submitBtnEl.addEventListener("click", () => {
                    const name = document.getElementById("nameInput").value.trim();
                    const complete = order.every((key) => picks[key]);
                    if (!name) {
                        showMessage("error", "Please enter your name before submitting.");
                        return;
                    }
                    if (!complete) {
                        showMessage("error", "Please complete every pick in the bracket before submitting.");
                        return;
                    }
                    const payload = buildPayload();
                    window.parent.postMessage({type: "SUBMIT_PREDICTION", payload}, "*");
                    showMessage("success", "Payload sent to Wix parent. See the JSON preview below for testing.");
                    showSuccessView();
                });
            }

            const backBtn = document.getElementById("backBtn");
            if (backBtn) backBtn.addEventListener("click", showBracketView);

            window.addEventListener("message", (event) => {
                if (!event.data) return;
                if (event.data.type === "SAVE_SUCCESS") {
                    showMessage("success", `Saved successfully${event.data.id ? ` (ID: ${event.data.id})` : ""}.`);
                    showSuccessView();
                }
                if (event.data.type === "SAVE_ERROR") {
                    showMessage("error", event.data.message || "Something went wrong while saving to Wix CMS.");
                }
            });

            window.addEventListener("resize", () => {
                reorderBracket();
                render();
            });

            render();
        </script>
    </body>
</html>
